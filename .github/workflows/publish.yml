name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # The runner's cached Node can lag behind the latest release, which
          # dependencies such as Astro may already require.
          check-latest: true
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Checks that the tag, the versions and the pinned dependencies agree,
      # runs check:packages and size, and publishes the checked tarballs with
      # the dist-tag "next" for a prerelease and "latest" for a release.
      # Versions already on npm are skipped, so a failed run can be re-run.
      # Try it locally with --dry-run instead of --publish.
      - name: Publish
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: node scripts/publish.mjs --git-tag "$GIT_TAG" --publish
