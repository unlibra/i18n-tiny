name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          # The runner's cached Node can lag behind the latest release, which
          # dependencies such as Astro may already require.
          check-latest: true
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Publish @i18n-tiny/core
        run: |
          cd packages/core
          pnpm pack
          npm publish *.tgz --provenance --access public

      - name: Publish @i18n-tiny/react
        run: |
          cd packages/react
          pnpm pack
          npm publish *.tgz --provenance --access public

      - name: Publish @i18n-tiny/next
        run: |
          cd packages/next
          pnpm pack
          npm publish *.tgz --provenance --access public

      - name: Publish @i18n-tiny/astro
        run: |
          cd packages/astro
          pnpm pack
          npm publish *.tgz --provenance --access public

      - name: Publish next-i18n-tiny
        run: |
          cd packages/aliases/next-i18n-tiny
          pnpm pack
          npm publish *.tgz --provenance --access public

      - name: Publish react-i18n-tiny
        run: |
          cd packages/aliases/react-i18n-tiny
          pnpm pack
          npm publish *.tgz --provenance --access public

      - name: Publish astro-i18n-tiny
        run: |
          cd packages/aliases/astro-i18n-tiny
          pnpm pack
          npm publish *.tgz --provenance --access public
