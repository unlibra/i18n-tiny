name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every supported Node.js version, with the frameworks the workspace
        # develops against (the highest supported majors). The examples job
        # below covers the other framework majors.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          # The runner's cached Node can lag behind the latest release, which
          # dependencies such as Astro may already require.
          check-latest: true
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Packs and installs the packages as consumers receive them, and resolves
      # every export. Catches broken exports that the tests above cannot see.
      - name: Check packages
        run: pnpm check:packages

      # Fails when the browser bundle of define() grows past 2KB.
      - name: Check bundle size
        run: pnpm size

  # Builds the examples as consumers would: out of the workspace, installed
  # from the packed packages, with the lowest and the highest supported
  # majors of Astro, Next.js and React, and React 18 and 19 each with both
  # Next.js majors. Covers what only a framework can check: the Astro
  # components, the react-server entries and the React context shared by the
  # entry points. The React example renders with the installed React. The
  # Next.js examples use the App Router, which renders with the React that
  # Next.js bundles, so for them the React major changes the types
  # (@types/react) that the build checks, not the React they render with.
  examples:
    name: Examples (Node ${{ matrix.node }}, Astro ${{ matrix.astro }}, Next.js ${{ matrix.next }}, React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lowest supported versions; 22.12.0 is the lowest Node.js
          # that the packages declare.
          - { node: '22.12.0', astro: 6, next: 15, react: 18 }
          # The highest
          - { node: '26', astro: 7, next: 16, react: 19 }
          # React 18 with Next.js 16, and React 19 with Next.js 15 (for the
          # Next.js examples, the types of that React)
          - { node: '24', astro: 7, next: 16, react: 18 }
          - { node: '24', astro: 6, next: 15, react: 19 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The packages are built and packed with the Node.js the workspace uses;
      # the examples are installed and built with the one of the row.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build and pack the packages
        run: |
          pnpm -r --filter "./packages/*" build
          node scripts/pack.mjs "$RUNNER_TEMP/tarballs"

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Build the examples
        env:
          ASTRO: ${{ matrix.astro }}
          NEXT: ${{ matrix.next }}
          REACT: ${{ matrix.react }}
        run: |
          node --version
          node scripts/build-examples.mjs --tarballs "$RUNNER_TEMP/tarballs" --astro "$ASTRO" --next "$NEXT" --react "$REACT"

  # Builds the VitePress site, as the deploy workflow does on main, so dead
  # links and config errors fail the pull request instead of the deploy.
  website:
    name: Build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The website is not part of the root workspace and pins its own pnpm.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # Job to verify that all tests passed
  # Use this job name in Branch Protection Rules
  status-check:
    runs-on: ubuntu-latest
    needs: [test, examples, website]
    if: always()
    steps:
      - name: Check test status
        if: ${{ needs.test.result != 'success' || needs.examples.result != 'success' || needs.website.result != 'success' }}
        run: exit 1
      - name: All tests passed
        run: echo "All tests passed"
