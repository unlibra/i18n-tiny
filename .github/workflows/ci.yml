name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # The runner's cached Node can lag behind the latest release, which
          # dependencies such as Astro may already require.
          check-latest: true
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Packs and installs the packages as consumers receive them, and resolves
      # every export. Catches broken exports that the tests above cannot see.
      - name: Check packages
        run: pnpm check:packages

      # Fails when a browser bundle grows past the 1KB the docs promise.
      - name: Check bundle size
        run: pnpm size

  # Job to verify that all tests passed
  # Use this job name in Branch Protection Rules
  status-check:
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check test status
        if: ${{ needs.test.result != 'success' }}
        run: exit 1
      - name: All tests passed
        run: echo "All tests passed"
