name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          # The runner's cached Node can lag behind the latest release, which
          # dependencies such as Astro may already require.
          check-latest: true
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Packs and installs the packages as consumers receive them, and resolves
      # every export. Catches broken exports that the tests above cannot see.
      - name: Check packages
        run: pnpm check:packages

      # Fails when a browser bundle grows past the 1KB the docs promise.
      - name: Check bundle size
        run: pnpm size

  # Builds the VitePress site, as the deploy workflow does on main, so dead
  # links and config errors fail the pull request instead of the deploy.
  website:
    name: Build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The website is not part of the root workspace and pins its own pnpm.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # Job to verify that all tests passed
  # Use this job name in Branch Protection Rules
  status-check:
    runs-on: ubuntu-latest
    needs: [test, website]
    if: always()
    steps:
      - name: Check test status
        if: ${{ needs.test.result != 'success' || needs.website.result != 'success' }}
        run: exit 1
      - name: All tests passed
        run: echo "All tests passed"
