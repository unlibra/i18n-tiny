name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so VitePress can read each page's last commit date
          # for lastUpdated and the sitemap's <lastmod>.
          fetch-depth: 0

      # The website is not part of the root workspace and pins its own pnpm.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./website/docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Tells IndexNow (Bing and the other search engines that share it) which
  # pages the push changed, once they are live. A page is a Markdown file in
  # website/docs/ (outside .vitepress/), so a change to the theme or the
  # config, which is not a change of content, sends nothing. Deleted pages
  # are sent too, so the search engines see they are gone. The key is public:
  # docs.unlibra.com/<key>.txt (the unlibra.github.io repository).
  indexnow:
    name: Notify IndexNow
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    # A new branch or a rewritten history has no commit to compare with.
    if: github.event.before != '0000000000000000000000000000000000000000' && !github.event.forced
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Send the changed pages
        env:
          BEFORE: ${{ github.event.before }}
          SITE: https://docs.unlibra.com/i18n-tiny/
          KEY: 67426e8c4c044cef96ebc2f901da0154
        run: |
          # The URLs cleanUrls serves: "foo/index.md" -> "foo/", "foo.md" -> "foo".
          urls=$(git diff --name-only --no-renames "$BEFORE" "$GITHUB_SHA" -- website/docs \
            | grep -E '\.md$' | grep -v '^website/docs/\.vitepress/' \
            | sed -e 's|^website/docs/||' -e 's|^index\.md$||' -e 's|/index\.md$|/|' -e 's|\.md$||' -e "s|^|$SITE|" || true)
          if [ -z "$urls" ]; then
            echo "No page changed."
            exit 0
          fi
          echo "$urls"
          body=$(jq -n --arg key "$KEY" --arg urls "$urls" \
            '{host: "docs.unlibra.com", key: $key, keyLocation: ("https://docs.unlibra.com/" + $key + ".txt"), urlList: ($urls | split("\n"))}')
          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -H 'content-type: application/json; charset=utf-8' --data "$body" https://api.indexnow.org/indexnow)
          echo "IndexNow: $status $(cat response.txt)"
          [ "$status" = 200 ] || [ "$status" = 202 ]
